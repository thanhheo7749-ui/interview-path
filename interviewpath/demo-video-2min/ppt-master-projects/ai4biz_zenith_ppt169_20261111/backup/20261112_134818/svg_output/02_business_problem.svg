  <g id="problem-context" data-pptx-bounds="68 552 1144 90">
    <rect x="68" y="556" width="1144" height="80" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow)"/>
    <use data-icon="phosphor-duotone/buildings" x="96" y="578" width="36" height="36" fill="#2563EB"/>
    <text x="148" y="591" font-family="Trebuchet MS" font-size="17" font-weight="bold" fill="#0F172A">When This Happens: High-Velocity Enterprise Hiring Waves (20–200+ Roles / Year)</text>
    <text x="148" y="616" font-size="15" fill="#64748B">Across Tech, SaaS &amp; Precision Manufacturing, every stage operates in a silo — <tspan fill="#7C3AED" font-weight="bold">candidate memory is lost at every handoff.</tspan></text>
    <text x="1184" y="601" font-size="13" font-weight="bold" fill="#64748B" text-anchor="end">Scenario data</text>
