    <text x="68" y="108" font-family="Trebuchet MS" font-size="40" font-weight="bold" fill="#0F172A">Recruitment &amp; Onboarding Are Fragmented</text>
    <text x="68" y="140" font-size="18" fill="#64748B">High CV volume &amp; static PDF handbooks create 4 costly leaks across the hiring journey.</text>
