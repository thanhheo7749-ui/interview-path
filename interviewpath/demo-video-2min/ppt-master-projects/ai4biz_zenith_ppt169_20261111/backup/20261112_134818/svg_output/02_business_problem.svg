  </g>

  <g id="leak-1" data-pptx-bounds="68 182 268 352">
    <line x1="242" y1="234" x2="336" y2="234" stroke="#FECACA" stroke-width="3" stroke-dasharray="6,6"/>
    <circle cx="202" cy="234" r="44" fill="#EF4444" fill-opacity="0.08"/>
