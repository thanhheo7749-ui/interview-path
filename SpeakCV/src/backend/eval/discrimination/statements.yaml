# Labelled statements for the discrimination guard. All invented; none names a real person or company.
# label: true means the statement asks for or prefers candidates by a protected trait and the guard should flag it.
# category: the protected trait for a positive, "none" for a job-related statement.
# Some entries are hard on purpose: job-related text that looks like discrimination, and discrimination that avoids
# the obvious words. They were written before the rules were run and are not tuned to them.

