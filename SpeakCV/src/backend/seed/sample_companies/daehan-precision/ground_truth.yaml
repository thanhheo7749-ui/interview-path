  - {source_ref: Follow the process, target_ref: Raises a change request instead of bending a procedure, relation: shown_by, quote: "We raise a change request and wait for approval"}
  - {source_ref: Document every decision, target_ref: Writes meeting minutes the same day, relation: shown_by, quote: "We write meeting minutes the same day"}
  - {source_ref: Escalate through the reporting line, target_ref: Does not go around the manager, relation: shown_by, quote: "We do not go around a manager to a senior leader"}
  - {source_ref: Quality before speed, target_ref: Accepts a late verified result over an open doubt, relation: shown_by, quote: "We would rather deliver one day late with a verified result"}
  - {source_ref: Follow the process, target_ref: Gửi đề xuất thay đổi quy trình, relation: shown_by, quote: "chúng tôi gửi đề xuất thay đổi và chờ phê duyệt"}
  # role requirements
  - {source_ref: Backend Developer, target_ref: Java, relation: requires, must_have: true, quote: "Java development experience of at least 3 years"}
  - {source_ref: Backend Developer, target_ref: Spring Boot, relation: requires, must_have: true, quote: "Spring Boot experience building REST services"}
  - {source_ref: Backend Developer, target_ref: Oracle and SQL tuning, relation: requires, must_have: true, quote: "Oracle database and SQL tuning experience"}
  - {source_ref: Backend Developer, target_ref: Design documents before coding, relation: requires, must_have: true, quote: "Habit of writing design documents before coding"}
  - {source_ref: Backend Developer, target_ref: Follows change control, relation: requires, must_have: true, quote: "Ability to follow change-control procedures and approval workflows"}
  - {source_ref: Backend Developer, target_ref: Written communication, relation: requires, must_have: true, quote: "Clear written communication in English, with Korean or Vietnamese"}
  - {source_ref: Backend Developer, target_ref: ISO 9001 familiarity, relation: requires, must_have: false, quote: "Familiarity with ISO 9001 quality management"}
  - {source_ref: Backend Developer, target_ref: Manufacturing execution systems, relation: requires, must_have: false, quote: "Experience with manufacturing execution systems"}
  - {source_ref: Backend Developer, target_ref: Korean language, relation: requires, must_have: false, quote: "Korean language ability for working with headquarters"}
  - {source_ref: Backend Developer, target_ref: Writes a daily report for the team lead, relation: expects, quote: "You write a short daily report for your team lead"}
  - {source_ref: Backend Developer, target_ref: Reports a breakdown to the manager first, relation: expects, quote: "you report it to your manager first"}
  # private notes
  - {source_ref: Backend Developer, target_ref: Backend salary band, relation: has_note, quote: "백엔드 개발자 급여 밴드는 연봉 기준 7,200만 원에서 9,600만 원이다"}
  - {source_ref: Backend Developer, target_ref: Dealbreaker bypassing the approval line, relation: has_note, quote: "절차와 결재선을 무시하고 혼자 판단하여 운영 서버를 수정한 경력이 확인되면 불합격 처리한다"}
  - {source_ref: Backend Developer, target_ref: Dealbreaker working without documentation, relation: has_note, quote: "문서화 없이 구두로만 일하는 습관이 면접에서 드러나면 채용하지 않는다"}
