services:
  speakcv-backend:
    build:
      context: ./SpeakCV/src/backend
    container_name: speakcv_backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SPEAKCV_BACKEND_PORT:-8001}:8000"
    env_file:
      - ./.env
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}@db:3306/${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
    depends_on:
      db:
        condition: service_healthy

  speakcv-frontend:
    build:
      context: ./SpeakCV/src/frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    container_name: speakcv_frontend
    restart: unless-stopped
    ports:
      - "${SPEAKCV_FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      NODE_ENV: production
    depends_on:
      - speakcv-backend

  db:
    image: mysql:8.0
    container_name: speakcv_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - speakcv_db_data:/var/lib/mysql

  interviewpath-demo:
    build:
      context: ./interviewpath/interviewpath-demo
    container_name: interviewpath_demo
    restart: unless-stopped
    ports:
      - "${INTERVIEWPATH_PORT:-5173}:5173"
    environment:
      VITE_API_URL: "${VITE_API_URL:-http://localhost:8001}"
    volumes:
      - ./interviewpath/interviewpath-demo:/app
      - interviewpath_node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

volumes:
  speakcv_db_data:
  interviewpath_node_modules:
